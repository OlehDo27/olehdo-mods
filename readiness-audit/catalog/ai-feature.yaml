# Пункты для продуктов, где есть вызовы моделей или AI-агентов (API или CLI вроде codex/qwen/claude).
# Схема полей — см. desktop-tool.yaml.

items:

- id: ai-prompt-injection
  area: ai
  title: Данные, попадающие в промпт, не могут переписать инструкции
  severity: critical
  profiles: [ai-feature]
  check: code
  why: Реплика в переводимом тексте или поле импорта говорит модели «игнорируй инструкции», и модель подчиняется.
  look_for:
    - разделение инструкций и данных (отдельные сообщения/блоки, явные разделители, указание считать данные данными)
    - вывод модели проверяется, а не исполняется и не пишется напрямую
    - фикстуры/тесты с инъекциями в данных
  red_flags:
    - пользовательский текст подставляется в промпт форматированием без границ
    - у модели есть инструменты с записью, а данные недоверенные
  evidence: сборка промпта и тест с инъекцией

- id: ai-agent-permissions
  area: ai
  title: AI-агенты запускаются с минимальными правами — песочница, без записи вне рабочего каталога, без авто-одобрения
  severity: critical
  profiles: [ai-feature]
  check: code
  applies_if: используются агентные CLI или модели с инструментами
  why: Агент, получивший инъекцию или ошибившийся, удаляет или переписывает файлы пользователя.
  look_for:
    - флаги запуска CLI (sandbox, approval mode, --yolo, --dangerously-*, --full-auto, workspace-write)
    - рабочий каталог задачи изолирован, проект не доступен на запись
    - переменные окружения, передаваемые агенту (токены, лишние ключи)
  red_flags:
    - обход песочницы или авто-одобрение всех действий
  evidence: все места запуска агентов с флагами

- id: ai-data-egress
  area: ai
  title: Понятно и задокументировано, какие данные уходят какому провайдеру; есть локальный вариант
  severity: high
  profiles: [ai-feature]
  check: code
  why: Текст под NDA уходит в облачную модель без ведома владельца.
  look_for:
    - что именно включается в промпт (контекст, глоссарий, соседние строки)
    - описание в документации и выбор провайдера пользователем
    - локальные модели как вариант
  evidence: сборка контекста промпта и документация

- id: ai-output-validation
  area: ai
  title: Ответ модели проверяется — формат, защищённые токены/плейсхолдеры, длина — и не попадает сразу в финал
  severity: high
  profiles: [ai-feature]
  check: code
  why: Модель теряет {player_name} или ломает разметку, и это уезжает в продукт.
  look_for:
    - разбор структурированного ответа со схемой (serde, zod), обработка мусора
    - проверка сохранности плейсхолдеров, тегов, переносов
    - некорректный ответ → повтор или флаг, а не запись
  evidence: валидатор ответа и тесты на плохие ответы

- id: ai-human-approval
  area: ai
  title: Необратимое (финальные данные, экспорт, git, удаление) не происходит без одобрения человека
  severity: high
  profiles: [ai-feature]
  check: code
  why: Ошибка модели становится фактом без единого человеческого взгляда.
  look_for:
    - разделение слоёв AI/финал, статус одобрения, гейт релиза/экспорта
  evidence: где проверяется одобрение перед необратимым действием

- id: ai-evals
  area: ai
  title: Есть набор eval-проверок, который прогоняют при смене модели или промпта
  severity: high
  profiles: [ai-feature]
  check: test
  why: Обновление модели тихо ухудшает качество, и это замечают пользователи.
  look_for:
    - эталонные входы с ожидаемыми свойствами результата (глоссарий, плейсхолдеры, стиль, длина)
    - скрипт прогона и сравнения с прошлым результатом
  red_flags:
    - качество проверяется только глазами на паре примеров
  evidence: eval-набор и скрипт прогона

- id: ai-prompt-versioning
  area: ai
  title: Промпты лежат в репозитории, версионируются, у каждого результата записано, чем он получен
  severity: medium
  profiles: [ai-feature]
  check: code
  why: Невозможно понять, почему результат стал хуже и каким промптом сделан старый.
  look_for:
    - промпты как файлы, а не строки по всему коду
    - запись модели, версии промпта, провайдера рядом с результатом
  evidence: каталог промптов и место записи происхождения

- id: ai-fallback
  area: ai
  title: Отказ провайдера (недоступен, лимит, истёк вход) даёт понятное состояние и путь дальше
  severity: medium
  profiles: [ai-feature]
  check: code
  why: Провайдер лёг — очередь висит молча или задачи помечаются как сделанные.
  look_for:
    - различение ошибок авторизации, лимитов, недоступности
    - переключение провайдера, возобновление очереди, сохранение прогресса
  evidence: обработка ошибок провайдера

- id: ai-model-deprecation
  area: ai
  title: Модель выбирается настройкой, а не зашита по коду; смена модели — одна правка
  severity: medium
  profiles: [ai-feature]
  check: code
  why: Модель снимают с поддержки, и её имя приходится искать по всему коду.
  look_for:
    - имена моделей в коде (grep по gpt-, claude-, qwen, gemini)
    - конфиг провайдера/модели
  evidence: где задаётся модель

- id: ai-spend-limits
  area: ai
  title: Ограничены расходы и число циклов — зациклившийся процесс не жжёт лимиты
  severity: medium
  profiles: [ai-feature]
  check: code
  why: Бесконечный цикл ревизий или повторов съедает подписку или счёт за ночь.
  look_for:
    - максимум циклов/повторов, лимиты на задачу и на день, счётчик токенов или вызовов
  evidence: где заданы лимиты

- id: ai-prompt-logs
  area: ai
  title: Промпты и ответы логируются для отладки, с ротацией и без секретов
  severity: medium
  profiles: [ai-feature]
  check: code
  why: Плохой результат нельзя разобрать, или логи хранят всё навсегда вместе с токенами.
  look_for:
    - сохранение входа/выхода задач, место хранения, срок жизни, очистка
  evidence: место логирования и очистки
